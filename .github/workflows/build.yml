name: Build ZMK firmware
on:
  workflow_dispatch:
  push:
    paths:
      - config/**
      - build.yaml
      - .github/workflows/**

jobs:
  build:
    # Keep the build workflow compatible with the Zephyr 3.5 manifest.
    # Newer workflows require board qualifiers introduced after this version.
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@v0.2.1
